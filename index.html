    <!-- Apply a saved theme before first paint, so a reload never flashes the
         other one. Same for motion and language.
         Mirrors src/lib/theme.ts and src/lib/prefs.ts — keep the keys in sync. -->
    <script>
      try {
        var t = localStorage.getItem("fl-theme");
        var d = document.documentElement;
        if (t === "light" || t === "dark") d.setAttribute("data-theme", t);
        var m = localStorage.getItem("fl-motion");
        if (m === "on" || m === "off") d.setAttribute("data-motion", m);
        if (localStorage.getItem("fl-lang") === "it") d.lang = "it";
      } catch (e) {}
    </script>
